# Tests EditMode de Unity en cada pull request y en cada cambio de main.
# Corre en un runner self-hosted (la PC de desarrollo, con Unity ya activado): las licencias
# Personal de Unity 6 quedan ligadas a la máquina y no sirven en los runners de GitHub.
# Ver la sección CI de CLAUDE.md para registrar el runner.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editmode:
    name: EditMode
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 30

    # La política de ejecución de la PC bloquea los .ps1 que genera el runner. -ExecutionPolicy
    # Bypass solo afecta a este proceso; no cambia la política del sistema.
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          # Conserva Library (caché de importación de Unity) entre ejecuciones.
          clean: false

      - name: Limpiar el workspace salvo Library
        # Con un shell personalizado el runner no propaga solo el código de salida del último comando.
        run: |
          git clean -ffdx -e /Library/
          exit $LASTEXITCODE

      # El script vive en un .ps1 con BOM: Windows PowerShell 5.1 lee como ANSI los scripts
      # sin BOM que genera el runner y rompería las tildes de los mensajes.
      - name: Tests EditMode
        run: |
          & ./.github/scripts/run-editmode-tests.ps1
          exit $LASTEXITCODE

      - name: Subir resultados
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
