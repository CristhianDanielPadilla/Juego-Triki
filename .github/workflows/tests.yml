# Tests EditMode de Unity en cada pull request y en cada cambio de main.
# Requiere los secretos UNITY_LICENSE, UNITY_EMAIL y UNITY_PASSWORD (ver CLAUDE.md).
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la ejecución anterior: ahorra minutos.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # para publicar el resumen de tests en el PR

jobs:
  editmode:
    name: EditMode
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Comprobar secretos de Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          if [ -z "$UNITY_LICENSE" ]; then missing="$missing UNITY_LICENSE"; fi
          if [ -z "$UNITY_EMAIL" ]; then missing="$missing UNITY_EMAIL"; fi
          if [ -z "$UNITY_PASSWORD" ]; then missing="$missing UNITY_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing. Ver la sección CI de CLAUDE.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # Library es la caché de importación de Unity: sin ella cada ejecución reimporta todo.
      - name: Caché de Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Tests EditMode
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # La versión de Unity se lee de ProjectSettings/ProjectVersion.txt.
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados EditMode

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: ignore
          retention-days: 14
