# Tests EditMode de Unity en cada pull request y en cada cambio de main.
# Requiere los secretos UNITY_LICENSE, UNITY_EMAIL y UNITY_PASSWORD (ver CLAUDE.md).
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la ejecución anterior: ahorra minutos.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # para publicar el resumen de tests en el PR

jobs:
  editmode:
    name: EditMode
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Comprobar secretos de Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          if [ -z "$UNITY_LICENSE" ]; then missing="$missing UNITY_LICENSE"; fi
          if [ -z "$UNITY_EMAIL" ]; then missing="$missing UNITY_EMAIL"; fi
          if [ -z "$UNITY_PASSWORD" ]; then missing="$missing UNITY_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing. Ver la sección CI de CLAUDE.md."
            exit 1
          fi

      # La imagen de Unity ocupa varios GB y el runner trae poco espacio libre.
      # Se borran SDKs preinstalados que este proyecto no usa.
      - name: Liberar espacio en disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # Library es la caché de importación de Unity: sin ella cada ejecución reimporta todo.
      - name: Caché de Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Tests EditMode
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Sin esto GameCI elige la imagen linux-il2cpp, mucho más pesada; para tests basta la base.
          # Al actualizar Unity, cambiar la versión aquí y en ProjectVersion.txt.
          customImage: unityci/editor:ubuntu-6000.6.0f1-base-3
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados EditMode

      # También si los tests fallan, pero no si ni siquiera se ejecutaron (no habría ruta).
      - name: Subir resultados
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: ignore
          retention-days: 14
